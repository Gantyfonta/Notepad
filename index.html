<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad Code Editor</title>
  
  <!-- CodeMirror Base CSS & Theme -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
  
  <style>
    :root {
      --bg-color: #fdfdfd;
      --text-color: #333;
      --border-color: #ccc;
      --tab-bg: #e0e0e0;
      --tab-active-bg: #fff;
      --toolbar-bg: #f1f1f1;
      --btn-bg: #fff;
      --btn-hover: #e9e9e9;
      --btn-text: #333;
    }

    body.dark-mode {
      --bg-color: #1e1e1e;
      --text-color: #f8f8f2;
      --border-color: #444;
      --tab-bg: #2d2d2d;
      --tab-active-bg: #1e1e1e;
      --toolbar-bg: #282a36;
      --btn-bg: #44475a;
      --btn-hover: #6272a4;
      --btn-text: #f8f8f2;
    }
    
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.2s, color 0.2s;
    }

    .toolbar {
      padding: 10px;
      background-color: var(--toolbar-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button, select {
      padding: 6px 12px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: var(--btn-bg);
      color: var(--btn-text);
      border-radius: 3px;
      font-size: 14px;
    }

    button:hover, select:hover { background: var(--btn-hover); }
    .spacer { flex-grow: 1; }

    .tabs {
      display: flex;
      background: var(--tab-bg);
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
    }

    .tab {
      padding: 8px 15px;
      cursor: pointer;
      border-right: 1px solid var(--border-color);
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .tab.active {
      background: var(--tab-active-bg);
      border-bottom: 1px solid var(--tab-active-bg);
      margin-bottom: -1px;
    }

    .close-tab {
      color: #888;
      font-weight: bold;
      border-radius: 50%;
      padding: 0 5px;
    }
    .close-tab:hover { color: red; background: var(--btn-hover); }

    .workspace {
      flex: 1;
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }

    .editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .preview-container {
      flex: 1;
      display: none;
      flex-direction: column;
      border-left: 2px solid var(--border-color);
      background: #fff;
    }

    iframe {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
    }

    .CodeMirror {
      height: 100%;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <button onclick="addNewTab()">+ New Tab</button>
    <button onclick="downloadSingle()">Download Current</button>
    <button onclick="downloadProject()">Download Zip</button>
    
    <div class="spacer"></div>
    
    <button onclick="togglePreview()" id="previewBtn">Show Preview / Run Code</button>
    
    <select id="themeSelector" onchange="changeTheme(this.value)">
      <option value="system">System Theme</option>
      <option value="light">Light Mode</option>
      <option value="dark">Dark Mode</option>
    </select>
  </div>

  <div class="tabs" id="tabContainer"></div>

  <div class="workspace">
    <div class="editor-container">
      <textarea id="editor"></textarea>
    </div>
    <div class="preview-container" id="previewContainer">
      <iframe id="previewFrame" title="Code Preview"></iframe>
    </div>
  </div>

  <!-- CodeMirror, Syntax Modes & JSZip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
  <!-- C-like languages for C# -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script>
    // --- Theme Management ---
    const themeSelector = document.getElementById('themeSelector');
    let currentThemeSetting = localStorage.getItem('notepadTheme') || 'system';
    themeSelector.value = currentThemeSetting;

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (currentThemeSetting === 'system') applyTheme('system');
    });

    function changeTheme(themeValue) {
      currentThemeSetting = themeValue;
      localStorage.setItem('notepadTheme', themeValue);
      applyTheme(themeValue);
    }

    function applyTheme(themeValue) {
      const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = themeValue === 'dark' || (themeValue === 'system' && isSystemDark);

      if (isDark) {
        document.body.classList.add('dark-mode');
        if (typeof editor !== 'undefined') editor.setOption("theme", "dracula");
      } else {
        document.body.classList.remove('dark-mode');
        if (typeof editor !== 'undefined') editor.setOption("theme", "default");
      }
    }

    // --- State & Editor Setup ---
    let tabs = JSON.parse(localStorage.getItem('notepadData')) || [
      { id: 'tab_' + Date.now(), name: 'index.html', content: '<h1>Hello World</h1>\n<p>Double click this tab to rename it to a .py or .cs file!</p>' }
    ];
    let activeTabId = tabs[0]?.id;
    let isPreviewOpen = false;

    const editorElement = document.getElementById('editor');
    const editor = CodeMirror.fromTextArea(editorElement, {
      lineNumbers: true,
      mode: "htmlmixed",
      theme: "default"
    });

    applyTheme(currentThemeSetting); 

    editor.on('change', () => {
      const activeIndex = tabs.findIndex(t => t.id === activeTabId);
      if (activeIndex > -1) {
        tabs[activeIndex].content = editor.getValue();
        saveData();
        if(isPreviewOpen) updatePreview();
      }
    });

    function saveData() {
      localStorage.setItem('notepadData', JSON.stringify(tabs));
    }

    // --- Dynamic Mode Switching ---
    function updateEditorMode(filename) {
      if (filename.endsWith('.py')) {
        editor.setOption("mode", "python");
      } else if (filename.endsWith('.cs')) {
        editor.setOption("mode", "text/x-csharp");
      } else {
        editor.setOption("mode", "htmlmixed");
      }
    }

    // --- Preview & Execution Logic ---
    function togglePreview() {
      const container = document.getElementById('previewContainer');
      const btn = document.getElementById('previewBtn');
      isPreviewOpen = !isPreviewOpen;
      
      if (isPreviewOpen) {
        container.style.display = 'flex';
        btn.textContent = 'Hide Preview / Run Code';
        updatePreview();
      } else {
        container.style.display = 'none';
        btn.textContent = 'Show Preview / Run Code';
      }
    }

    function updatePreview() {
      const frame = document.getElementById('previewFrame');
      const tab = tabs.find(t => t.id === activeTabId);
      const code = editor.getValue();

      if (tab.name.endsWith('.py')) {
        frame.srcdoc = `
          <!DOCTYPE html>
          <html>
          <head>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/brython/3.11.3/brython.min.js"><\/script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/brython/3.11.3/brython_stdlib.min.js"><\/script>
          </head>
          <body onload="brython()" style="font-family: monospace; padding: 10px; color: #000; background: #fff;">
            <h3>Console Output:</h3>
            <hr>
            <script type="text/python">
import sys
from browser import document

class DocumentOutput:
    def write(self, text):
        document.body.innerHTML += text.replace('\\n', '<br>')
sys.stdout = DocumentOutput()
sys.stderr = DocumentOutput()

${code.replace(/</g, '\\x3c')} 
            <\/script>
          </body>
          </html>
        `;
      } else if (tab.name.endsWith('.cs')) {
        frame.srcdoc = `
          <body style="font-family: monospace; padding: 10px; background: #fff; color: #333;">
            <h3>⚠️ Execution Limit</h3>
            <p>C# is a compiled language. You can write and save your C# code here, but you will need to download the file and run it using the .NET runtime on your computer.</p>
          </body>
        `;
      } else {
        frame.srcdoc = code;
      }
    }

    // --- Tab Rendering & Management ---
    function renderTabs() {
      const container = document.getElementById('tabContainer');
      container.innerHTML = '';
      
      tabs.forEach(tab => {
        const tabEl = document.createElement('div');
        tabEl.className = `tab ${tab.id === activeTabId ? 'active' : ''}`;
        
        const nameEl = document.createElement('span');
        nameEl.className = 'tab-name';
        nameEl.textContent = tab.name;
        nameEl.onclick = () => switchTab(tab.id);
        nameEl.ondblclick = () => renameTab(tab.id);

        const closeEl = document.createElement('span');
        closeEl.textContent = '×';
        closeEl.className = 'close-tab';
        closeEl.onclick = (e) => {
          e.stopPropagation();
          closeTab(tab.id);
        };

        tabEl.appendChild(nameEl);
        tabEl.appendChild(closeEl);
        container.appendChild(tabEl);
      });
    }

    function switchTab(id) {
      activeTabId = id;
      const tab = tabs.find(t => t.id === id);
      if (tab) {
        updateEditorMode(tab.name);
        editor.setValue(tab.content);
        if (isPreviewOpen) updatePreview();
      }
      renderTabs();
    }

    function addNewTab() {
      const newTab = {
        id: 'tab_' + Date.now(),
        name: `untitled_${tabs.length + 1}.html`,
        content: ''
      };
      tabs.push(newTab);
      saveData();
      switchTab(newTab.id);
    }

    function closeTab(id) {
      if (tabs.length === 1) {
        alert("You must have at least one tab open.");
        return;
      }
      const index = tabs.findIndex(t => t.id === id);
      tabs.splice(index, 1);
      saveData();
      
      if (activeTabId === id) {
        const newActive = tabs[index - 1] || tabs[0];
        switchTab(newActive.id);
      } else {
        renderTabs();
      }
    }

    function renameTab(id) {
      const tab = tabs.find(t => t.id === id);
      const newName = prompt("Enter new file name (e.g., script.py, app.cs, or index.html):", tab.name);
      if (newName && newName.trim() !== '') {
        tab.name = newName.trim();
        saveData();
        updateEditorMode(tab.name);
        if (isPreviewOpen) updatePreview();
        renderTabs();
      }
    }

    // --- Download Logic ---
    function downloadSingle() {
      const tab = tabs.find(t => t.id === activeTabId);
      if (!tab) return;
      const blob = new Blob([tab.content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = tab.name;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function downloadProject() {
      const zip = new JSZip();
      tabs.forEach(tab => zip.file(tab.name, tab.content));
      const content = await zip.generateAsync({ type: "blob" });
      const url = URL.createObjectURL(content);
      const a = document.createElement('a');
      a.href = url;
      a.download = "my_project.zip";
      a.click();
      URL.revokeObjectURL(url);
    }

    // Boot up
    if (!activeTabId && tabs.length > 0) activeTabId = tabs[0].id;
    // Set the correct mode for the initial tab based on its name
    const initialTab = tabs.find(t => t.id === activeTabId);
    if(initialTab) updateEditorMode(initialTab.name);
    switchTab(activeTabId);

  </script>
</body>
</html>
