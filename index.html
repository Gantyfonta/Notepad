<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad Code Editor (With Uploads, Console, Linked Tabs & Resizable Panels)</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
  
  <style>
    :root {
      --bg-color: #fdfdfd;
      --text-color: #333;
      --border-color: #ccc;
      --tab-bg: #e0e0e0;
      --tab-active-bg: #fff;
      --toolbar-bg: #f1f1f1;
      --btn-bg: #fff;
      --btn-hover: #e9e9e9;
      --btn-text: #333;
    }

    body.dark-mode {
      --bg-color: #1e1e1e;
      --text-color: #f8f8f2;
      --border-color: #444;
      --tab-bg: #2d2d2d;
      --tab-active-bg: #1e1e1e;
      --toolbar-bg: #282a36;
      --btn-bg: #44475a;
      --btn-hover: #6272a4;
      --btn-text: #f8f8f2;
    }
    
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.2s, color 0.2s;
    }

    .toolbar {
      padding: 10px;
      background-color: var(--toolbar-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button, select {
      padding: 6px 12px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: var(--btn-bg);
      color: var(--btn-text);
      border-radius: 3px;
      font-size: 14px;
    }

    button:hover, select:hover { background: var(--btn-hover); }
    .spacer { flex-grow: 1; }

    .tabs {
      display: flex;
      background: var(--tab-bg);
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
    }

    .tab {
      padding: 8px 15px;
      cursor: pointer;
      border-right: 1px solid var(--border-color);
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .tab.active {
      background: var(--tab-active-bg);
      border-bottom: 1px solid var(--tab-active-bg);
      margin-bottom: -1px;
    }

    .close-tab {
      color: #888;
      font-weight: bold;
      border-radius: 50%;
      padding: 0 5px;
    }
    .close-tab:hover { color: red; background: var(--btn-hover); }

    .workspace {
      flex: 1;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      position: relative;
    }

    .editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 150px;
    }

    /* Vertical Splitter (between Editor and Preview) */
    .splitter-v {
      width: 5px;
      background-color: var(--border-color);
      cursor: col-resize;
      transition: background-color 0.2s;
    }

    .splitter-v:hover, .splitter-v.dragging {
      background-color: #007acc;
    }

    .preview-container {
      width: 50%;
      display: none;
      flex-direction: column;
      background: #fff;
      min-width: 150px;
    }

    iframe {
      flex: 1;
      border: none;
      width: 100%;
      min-height: 50px;
    }

    /* Horizontal Splitter (between Iframe and Console) */
    .splitter-h {
      height: 5px;
      background-color: var(--border-color);
      cursor: row-resize;
      transition: background-color 0.2s;
    }

    .splitter-h:hover, .splitter-h.dragging {
      background-color: #007acc;
    }

    /* Console Styles */
    .console-pane {
      height: 35%;
      display: flex;
      flex-direction: column;
      background-color: #1e1e1e;
      color: #f8f8f2;
      min-height: 40px;
    }

    .console-header {
      background-color: #282a36;
      padding: 5px 10px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #444;
      color: #fff;
    }

    .console-header button {
      padding: 2px 8px;
      font-size: 12px;
      background: #44475a;
      border: none;
      color: #fff;
    }

    .console-header button:hover {
      background: #6272a4;
    }

    .console-output {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13px;
    }

    .log-line { margin-bottom: 4px; word-wrap: break-word; border-bottom: 1px solid #333; padding-bottom: 4px;}
    .log-line.error { color: #ff5555; }
    .log-line.warn { color: #f1fa8c; }
    .log-line.log { color: #f8f8f2; }

    .CodeMirror {
      height: 100%;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <button onclick="addNewTab()">+ New Tab</button>
    <button onclick="document.getElementById('fileUpload').click()">Upload Files</button>
    <input type="file" id="fileUpload" multiple style="display: none;" onchange="handleFileUpload(event)">
    <button onclick="downloadSingle()">Download Current</button>
    <button onclick="downloadProject()">Download Zip</button>
    
    <div class="spacer"></div>
    
    <button onclick="togglePreview()" id="previewBtn">Show Preview / Run Code</button>
    
    <select id="themeSelector" onchange="changeTheme(this.value)">
      <option value="system">System Theme</option>
      <option value="light">Light Mode</option>
      <option value="dark">Dark Mode</option>
    </select>
  </div>

  <div class="tabs" id="tabContainer"></div>

  <div class="workspace">
    <div class="editor-container" id="editorContainer">
      <textarea id="editor"></textarea>
    </div>
    
    <div class="splitter-v" id="splitterV"></div>

    <div class="preview-container" id="previewContainer">
      <iframe id="previewFrame" title="Code Preview"></iframe>
      
      <div class="splitter-h" id="splitterH"></div>

      <div class="console-pane" id="consolePane">
        <div class="console-header">
          <span>Console Output</span>
          <button onclick="clearConsole()">Clear</button>
        </div>
        <div id="consoleOutput" class="console-output"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script>
    // --- Resizable Panels Logic ---
    const splitterV = document.getElementById('splitterV');
    const editorContainer = document.getElementById('editorContainer');
    const previewContainer = document.getElementById('previewContainer');
    let isDraggingV = false;

    splitterV.addEventListener('mousedown', (e) => {
      isDraggingV = true;
      splitterV.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      e.preventDefault();
    });

    const splitterH = document.getElementById('splitterH');
    const previewFrame = document.getElementById('previewFrame');
    const consolePane = document.getElementById('consolePane');
    let isDraggingH = false;

    splitterH.addEventListener('mousedown', (e) => {
      isDraggingH = true;
      splitterH.classList.add('dragging');
      document.body.style.cursor = 'row-resize';
      e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
      if (isDraggingV) {
        const workspaceRect = document.querySelector('.workspace').getBoundingClientRect();
        const newWidth = e.clientX - workspaceRect.left;
        const totalWidth = workspaceRect.width;
        
        if (newWidth > 150 && newWidth < totalWidth - 150) {
          editorContainer.style.flex = 'none';
          editorContainer.style.width = newWidth + 'px';
          previewContainer.style.flex = '1';
        }
      }

      if (isDraggingH) {
        const previewRect = previewContainer.getBoundingClientRect();
        const newHeight = e.clientY - previewRect.top;
        const totalHeight = previewRect.height;

        if (newHeight > 50 && newHeight < totalHeight - 50) {
          previewFrame.style.flex = 'none';
          previewFrame.style.height = newHeight + 'px';
          consolePane.style.flex = '1';
        }
      }
    });

    window.addEventListener('mouseup', () => {
      if (isDraggingV || isDraggingH) {
        isDraggingV = false;
        isDraggingH = false;
        splitterV.classList.remove('dragging');
        splitterH.classList.remove('dragging');
        document.body.style.cursor = 'default';
      }
    });

    // --- Console Logic (Main Window) ---
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'console') {
        const consoleOutput = document.getElementById('consoleOutput');
        const logLine = document.createElement('div');
        logLine.className = 'log-line ' + (event.data.logType || 'log');
        logLine.textContent = event.data.message;
        consoleOutput.appendChild(logLine);
        consoleOutput.scrollTop = consoleOutput.scrollHeight; 
      }
    });

    function clearConsole() {
      document.getElementById('consoleOutput').innerHTML = '';
    }

    // --- Theme Management ---
    const themeSelector = document.getElementById('themeSelector');
    let currentThemeSetting = localStorage.getItem('notepadTheme') || 'system';
    themeSelector.value = currentThemeSetting;

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (currentThemeSetting === 'system') applyTheme('system');
    });

    function changeTheme(themeValue) {
      currentThemeSetting = themeValue;
      localStorage.setItem('notepadTheme', themeValue);
      applyTheme(themeValue);
    }

    function applyTheme(themeValue) {
      const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = themeValue === 'dark' || (themeValue === 'system' && isSystemDark);

      if (isDark) {
        document.body.classList.add('dark-mode');
        if (typeof editor !== 'undefined') editor.setOption("theme", "dracula");
      } else {
        document.body.classList.remove('dark-mode');
        if (typeof editor !== 'undefined') editor.setOption("theme", "default");
      }
    }

    // --- State & Editor Setup ---
    let tabs = JSON.parse(localStorage.getItem('notepadData')) || [
      { id: 'tab_' + Date.now(), name: 'script.py', content: 'print("Hello World!")\n\n# Open the preview to see this in the console below!\nfor i in range(3):\n    print(f"Count: {i}")' }
    ];
    let activeTabId = tabs[0]?.id;
    let isPreviewOpen = false;

    const editorElement = document.getElementById('editor');
    const editor = CodeMirror.fromTextArea(editorElement, {
      lineNumbers: true,
      mode: "python",
      theme: "default"
    });

    applyTheme(currentThemeSetting); 

    editor.on('change', () => {
      const activeIndex = tabs.findIndex(t => t.id === activeTabId);
      if (activeIndex > -1) {
        tabs[activeIndex].content = editor.getValue();
        saveData();
      }
    });

    function saveData() {
      localStorage.setItem('notepadData', JSON.stringify(tabs));
    }

    // --- File Upload Logic ---
    function handleFileUpload(event) {
      const files = event.target.files;
      if (files.length === 0) return;

      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const newTab = {
            id: 'tab_' + Date.now() + Math.random(),
            name: file.name,
            content: e.target.result
          };
          tabs.push(newTab);
          saveData();
          switchTab(newTab.id); 
        };
        reader.readAsText(file);
      });
      
      event.target.value = ''; 
    }

    // --- Dynamic Mode Switching ---
    function updateEditorMode(filename) {
      if (filename.endsWith('.py')) {
        editor.setOption("mode", "python");
      } else if (filename.endsWith('.cs')) {
        editor.setOption("mode", "text/x-csharp");
      } else {
        editor.setOption("mode", "htmlmixed");
      }
    }

    // --- Preview & Execution Logic ---
    function togglePreview() {
      const container = document.getElementById('previewContainer');
      const btn = document.getElementById('previewBtn');
      isPreviewOpen = !isPreviewOpen;
      
      if (isPreviewOpen) {
        container.style.display = 'flex';
        btn.textContent = 'Hide Preview / Run Code';
        updatePreview();
      } else {
        container.style.display = 'none';
        btn.textContent = 'Show Preview / Run Code';
      }
    }

    const jsConsoleInterceptor = `
      <script>
        (function(){
          window.onerror = function(msg, url, lineNo) {
            window.parent.postMessage({ type: 'console', logType: 'error', message: msg + ' (Line: ' + lineNo + ')' }, '*');
            return false;
          };
          const log = console.log, err = console.error, warn = console.warn;
          console.log = function(...args) { window.parent.postMessage({ type: 'console', logType: 'log', message: args.join(' ') }, '*'); log.apply(console, args); };
          console.error = function(...args) { window.parent.postMessage({ type: 'console', logType: 'error', message: args.join(' ') }, '*'); err.apply(console, args); };
          console.warn = function(...args) { window.parent.postMessage({ type: 'console', logType: 'warn', message: args.join(' ') }, '*'); warn.apply(console, args); };
        })();
      <\/script>
    `;

    function updatePreview() {
      clearConsole(); 
      const frame = document.getElementById('previewFrame');
      const tab = tabs.find(t => t.id === activeTabId);
      
      let code = editor.getValue(); 

      // --- BLOB LOGIC: Link HTML, CSS, and JS Tabs together ---
      const blobUrls = {};
      tabs.forEach(t => {
        let mime = 'text/plain';
        if (t.name.endsWith('.css')) mime = 'text/css';
        if (t.name.endsWith('.js')) mime = 'application/javascript';
        blobUrls[t.name] = URL.createObjectURL(new Blob([t.content], { type: mime }));
      });

      tabs.forEach(t => {
        if (t.id !== activeTabId) {
           const escapedName = t.name.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, '\\$&');
           const regex = new RegExp(`(src|href)=["'](\\.\\/)?${escapedName}["']`, 'g');
           code = code.replace(regex, `$1="${blobUrls[t.name]}"`);
        }
      });
      // --------------------------------------------------------

      if (tab.name.endsWith('.py')) {
        frame.srcdoc = `
          <!DOCTYPE html>
          <html>
          <head>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/brython/3.11.3/brython.min.js"><\/script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/brython/3.11.3/brython_stdlib.min.js"><\/script>
          </head>
          <body onload="brython()" style="font-family: sans-serif; padding: 10px; background: #fff; color: #333;">
            <p><i>Python environment loaded. Check the console below for output.</i></p>
            <script type="text/python">
import sys
from browser import window

class ConsoleOutput:
    def __init__(self, log_type):
        self.log_type = log_type
        self.buffer = ""
    def write(self, text):
        self.buffer += text
        if "\\n" in self.buffer:
            lines = self.buffer.split("\\n")
            for line in lines[:-1]:
                window.parent.postMessage({'type': 'console', 'logType': self.log_type, 'message': line}, '*')
            self.buffer = lines[-1]
    def flush(self):
        if self.buffer:
            window.parent.postMessage({'type': 'console', 'logType': self.log_type, 'message': self.buffer}, '*')
            self.buffer = ""

sys.stdout = ConsoleOutput("log")
sys.stderr = ConsoleOutput("error")

${code.replace(/</g, '\\x3c')} 
            <\/script>
          </body>
          </html>
        `;
      } else if (tab.name.endsWith('.cs')) {
        frame.srcdoc = `
          <body style="font-family: sans-serif; padding: 10px; background: #fff; color: #333;">
            <h3>⚠️ Execution Limit</h3>
            <p>C# is a compiled language. You can write and save your C# code here, but you will need to download the file and run it using the .NET runtime on your computer.</p>
          </body>
        `;
      } else {
        frame.srcdoc = jsConsoleInterceptor + code;
      }
    }

    // --- Tab Rendering & Management ---
    function renderTabs() {
      const container = document.getElementById('tabContainer');
      container.innerHTML = '';
      
      tabs.forEach(tab => {
        const tabEl = document.createElement('div');
        tabEl.className = `tab ${tab.id === activeTabId ? 'active' : ''}`;
        
        const nameEl = document.createElement('span');
        nameEl.className = 'tab-name';
        nameEl.textContent = tab.name;
        nameEl.onclick = () => switchTab(tab.id);
        nameEl.ondblclick = () => renameTab(tab.id);

        const closeEl = document.createElement('span');
        closeEl.textContent = '×';
        closeEl.className = 'close-tab';
        closeEl.onclick = (e) => {
          e.stopPropagation();
          closeTab(tab.id);
        };

        tabEl.appendChild(nameEl);
        tabEl.appendChild(closeEl);
        container.appendChild(tabEl);
      });
    }

    function switchTab(id) {
      activeTabId = id;
      const tab = tabs.find(t => t.id === id);
      if (tab) {
        updateEditorMode(tab.name);
        editor.setValue(tab.content);
        const frame = document.getElementById('previewFrame');
        if (isPreviewOpen) {
           frame.srcdoc = "<body style='font-family: sans-serif; padding: 10px;'><i>Click 'Hide Preview' then 'Show Preview / Run Code' to execute this tab.</i></body>";
        }
      }
      renderTabs();
    }

    function addNewTab() {
      const newTab = {
        id: 'tab_' + Date.now(),
        name: `untitled_${tabs.length + 1}.html`,
        content: ''
      };
      tabs.push(newTab);
      saveData();
      switchTab(newTab.id);
    }

    function closeTab(id) {
      if (tabs.length === 1) {
        alert("You must have at least one tab open.");
        return;
      }
      const index = tabs.findIndex(t => t.id === id);
      tabs.splice(index, 1);
      saveData();
      
      if (activeTabId === id) {
        const newActive = tabs[index - 1] || tabs[0];
        switchTab(newActive.id);
      } else {
        renderTabs();
      }
    }

    function renameTab(id) {
      const tab = tabs.find(t => t.id === id);
      const newName = prompt("Enter new file name (e.g., script.py, app.cs, or index.html):", tab.name);
      if (newName && newName.trim() !== '') {
        tab.name = newName.trim();
        saveData();
        updateEditorMode(tab.name);
        renderTabs();
      }
    }

    // --- Download Logic ---
    function downloadSingle() {
      const tab = tabs.find(t => t.id === activeTabId);
      if (!tab) return;
      const blob = new Blob([tab.content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = tab.name;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function downloadProject() {
      const zip = new JSZip();
      tabs.forEach(tab => zip.file(tab.name, tab.content));
      const content = await zip.generateAsync({ type: "blob" });
      const url = URL.createObjectURL(content);
      const a = document.createElement('a');
      a.href = url;
      a.download = "my_project.zip";
      a.click();
      URL.revokeObjectURL(url);
    }

    // Boot up
    if (!activeTabId && tabs.length > 0) activeTabId = tabs[0].id;
    const initialTab = tabs.find(t => t.id === activeTabId);
    if(initialTab) updateEditorMode(initialTab.name);
    switchTab(activeTabId);

  </script>
</body>
</html>
